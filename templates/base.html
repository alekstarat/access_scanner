<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Access Scanner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="{{ url_for('index') }}" style="color:inherit;text-decoration:none"><span>Access</span> Scanner</a>
        <div class="sidebar-links">
          <a href="{{ url_for('index') }}">Hosts</a>
          <a href="{{ url_for('tasks_page') }}">Tasks</a>
        </div>
      </div>
      <nav class="nav-list">
        {% for h in nav_hosts %}
        <a class="nav-item {% if host and host.id == h.id %}active{% endif %}{% if profile and profile.id == h.id %}active{% endif %}"
           href="{{ url_for('host_detail', host_id=h.id) }}">
          <span class="risk-dot" style="background:
            {% if h.risk_score >= 70 %}var(--critical)
            {% elif h.risk_score >= 40 %}var(--high)
            {% elif h.risk_score >= 20 %}var(--medium)
            {% else %}var(--ok){% endif %}"></span>
          <span class="ip">{{ h.ip }}</span>
          <span class="score">{{ h.risk_score }}</span>
        </a>
        {% else %}
        <div class="empty" style="padding:16px">Нет хостов</div>
        {% endfor %}
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        {% block topbar %}
        <h1><a href="{{ url_for('index') }}" style="color:inherit;text-decoration:none">Hosts</a></h1>
        {% endblock %}
      </header>

      <div class="content">
        {% block content %}{% endblock %}
      </div>

      <footer>Access Scanner · host-centric model</footer>
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
