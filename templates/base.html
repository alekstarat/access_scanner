<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recon{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --panel2: #243044;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --low: #22c55e;
      --medium: #eab308;
      --high: #f97316;
      --critical: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    header .brand span { color: var(--muted); font-weight: 500; margin-left: 8px; font-size: 0.9em; }
    main { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .stats {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 110px;
    }
    .stat .n { font-size: 1.4rem; font-weight: 700; }
    .stat .l { color: var(--muted); font-size: 0.8rem; }
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
    }
    input[type=search], select, button, .btn {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.95rem;
    }
    input[type=search] { min-width: 240px; flex: 1; }
    button, .btn { cursor: pointer; background: var(--accent); border-color: transparent; }
    button:hover, .btn:hover { filter: brightness(1.1); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 0.92rem;
    }
    th { color: var(--muted); font-weight: 600; background: var(--panel2); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(59,130,246,0.06); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .badge.LOW { background: rgba(34,197,94,0.15); color: var(--low); }
    .badge.MEDIUM { background: rgba(234,179,8,0.15); color: var(--medium); }
    .badge.HIGH { background: rgba(249,115,22,0.15); color: var(--high); }
    .badge.CRITICAL { background: rgba(239,68,68,0.15); color: var(--critical); }
    .sev-0, .sev-1 { color: var(--muted); }
    .sev-2 { color: var(--medium); }
    .sev-3, .sev-4 { color: var(--critical); font-weight: 600; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 600;
    }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88rem; }
    .muted { color: var(--muted); }
    pre {
      background: #0b1016;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
      font-size: 0.82rem;
    }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; }
    .kv .k { color: var(--muted); }
    .tag {
      display: inline-block;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      margin: 2px 4px 2px 0;
      font-size: 0.85rem;
    }
    .empty { color: var(--muted); padding: 12px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Recon <span>local viewer</span></div>
    <a href="{{ url_for('index') }}">Hosts</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
